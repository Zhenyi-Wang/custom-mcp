name: custom-mcp

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    networks:
      - mcp-net

  mcp-server:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_TOKEN=${MCP_TOKEN:-}
    networks:
      - mcp-net
    depends_on:
      - searxng

networks:
  mcp-net:
    driver: bridge

volumes:
  searxng-data:
