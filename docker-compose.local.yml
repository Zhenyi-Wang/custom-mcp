# 本地试跑 mcp-searxng(ihor-sokoliuk),与生产 docker-compose.yml 隔离:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down
name: custom-mcp-local

services:
  searxng:
    # 与生产同款 impersonate fork(见 settings.yml 头部注释)。ghcr.io/ikidd
    # 官方镜像仅 amd64,arm64 需源码自建(生产 compose 有构建命令);
    # amd64 机器可直接用 ghcr.io/ikidd/searxng-impersonate:8c630f6
    image: searxng-impersonate:8c630f6
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8081:8080" # 本地调试用,直连验证 JSON API
    networks:
      - mcp-net

  mcp-searxng:
    image: docker.io/isokoliuk/mcp-searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8080"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      # hardened 模式(对齐生产部署方式:HTTP + Bearer Token)
      - MCP_HTTP_HARDEN=true
      - MCP_HTTP_AUTH_TOKEN=${MCP_TOKEN:-}
      - MCP_HTTP_ALLOWED_ORIGINS=http://localhost:8100,http://127.0.0.1:8100
      # Host 白名单按客户端实际发送的 Host(含端口)精确匹配;
      # 默认值按容器内 MCP_HTTP_PORT 生成,端口映射后不匹配,需显式覆盖
      - MCP_HTTP_ALLOWED_HOSTS=127.0.0.1:8100,localhost:8100
    networks:
      - mcp-net
    depends_on:
      - searxng

networks:
  mcp-net:
    driver: bridge
